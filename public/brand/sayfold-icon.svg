<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <clipPath id="cardClip">
      <rect x="16" y="16" width="480" height="480" rx="112" ry="112" />
    </clipPath>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <g clip-path="url(#cardClip)">
    <!-- Dark Charcoal Body -->
    <rect x="16" y="16" width="480" height="480" fill="#1F1E1B" />
    
    <!-- Terracotta Folded Dog-Ear Corner -->
    <path d="M 336 16 L 496 176 L 496 16 Z" fill="#E8643C" />
    <path d="M 336 16 Q 348 160 496 176 L 336 16 Z" fill="#E8643C" />
    <path d="M 336 16 C 352 144 368 160 496 176 L 360 176 C 342 176 336 170 336 152 Z" fill="#D9532B" opacity="0.15" />
    <!-- Clean fold diagonal cut -->
    <path d="M 346 16 C 346 96 416 166 496 166 L 496 16 Z" fill="#E8643C" />
  </g>
  
  <!-- Centered Audio Waveform -->
  <g fill="#F6F1E9">
    <!-- Bar 1 (Leftmost, Short) -->
    <rect x="116" y="216" width="36" height="80" rx="18" />
    <!-- Bar 2 (Medium) -->
    <rect x="176" y="172" width="36" height="168" rx="18" />
    <!-- Bar 3 (Center, Tallest) -->
    <rect x="238" y="136" width="36" height="240" rx="18" />
    <!-- Bar 4 (Medium) -->
    <rect x="300" y="188" width="36" height="136" rx="18" />
    <!-- Bar 5 (Rightmost, Short) -->
    <rect x="360" y="220" width="36" height="72" rx="18" />
  </g>
</svg>

